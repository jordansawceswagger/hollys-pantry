# Decap CMS config - Holly's Pantry
# Docs: https://decapcms.org/docs/configuration-options/

backend:
  name: github
  repo: jordansawceswagger/hollys-pantry
  branch: main
  # OAuth handshake runs through the Cloudflare Worker (see admin/SETUP.md).
  base_url: https://hollys-pantry-oauth.jordansdevicesinfo.workers.dev
  commit_messages:
    update: "Holly edit: {{path}}"
    uploadMedia: "Holly upload: {{path}}"

# Where uploaded images (e.g. headshot, event photos) land in the repo
media_folder: "assets/uploads"
public_folder: "assets/uploads"

site_url: https://hollyspantry.org
logo_url: https://hollyspantry.org/assets/cover_herbs_transparent.png

collections:
  - name: pages
    label: "Your Website"
    files:
      - name: calendar
        label: "The Calendar - open days, classes & markets"
        file: "content/calendar.json"
        fields:
          - label: "Events"
            name: events
            widget: list
            summary: "{{fields.title}} - {{fields.date}}"
            fields:
              - { label: "What is it?", name: title, widget: string, hint: "e.g. Open at the Pantry, Sourdough Class, Farmers Market" }
              - { label: "First day", name: date, widget: datetime, format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false, picker_utc: false }
              - { label: "Last day (skip this for one-day events)", name: endDate, widget: datetime, format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false, picker_utc: false, required: false, default: "" }
              - { label: "What time?", name: time, widget: string, required: false, hint: "Plain words: 10-2, or 6pm" }
              - { label: "Where?", name: where, widget: string, required: false, default: "165 Monroe St, Bigfork" }
              - { label: "Anything else people should know?", name: note, widget: text, required: false, hint: "What to bring, how to sign up, that kind of thing." }

      - name: meet
        label: "Meet Us - the story & your photo"
        file: "content/meet.json"
        fields:
          - label: "The line under 'Meet Holly'"
            name: intro
            widget: string
          - label: "The story"
            name: story
            widget: text
            hint: "Write naturally. Leave a blank line between paragraphs. Stars around a word make it *slanted*."
          - label: "Your photo"
            name: headshot
            widget: image
            required: false

      - name: stockists
        label: "The Map - stores that carry your products"
        file: "stockists.json"
        fields:
          - label: "Regions (map jump buttons - leave these alone unless adding a new town)"
            name: regions
            widget: list
            summary: "{{fields.name}}"
            collapsed: true
            fields:
              - { label: "Slug", name: slug, widget: string }
              - { label: "Name", name: name, widget: string }
              - { label: "Latitude", name: lat, widget: number, value_type: float }
              - { label: "Longitude", name: lng, widget: number, value_type: float }
              - { label: "Zoom", name: zoom, widget: number, value_type: int }
          - label: "Products (the master list - ask Jordan before changing the short names)"
            name: products
            widget: list
            summary: "{{fields.name}}"
            collapsed: true
            fields:
              - { label: "Short name (no spaces, like maple-nut-granola)", name: slug, widget: string }
              - { label: "Name", name: name, widget: string }
          - label: "Stores"
            name: stockists
            widget: list
            summary: "{{fields.name}}"
            fields:
              - { label: "Short name (no spaces, like birch-provisions)", name: slug, widget: string }
              - { label: "Store name", name: name, widget: string }
              - { label: "Their website (optional)", name: website, widget: string, required: false }
              - { label: "Is this your own home base?", name: home, widget: boolean, required: false, default: false }
              - { label: "Address", name: address, widget: string, hint: "Full street address with town and state - the map finds the spot from this automatically." }
              - { label: "Hours", name: hours, widget: string }
              - { label: "Latitude (leave empty - fills itself from the address)", name: lat, widget: number, value_type: float, required: false }
              - { label: "Longitude (leave empty)", name: lng, widget: number, value_type: float, required: false }
              - label: "Which products do they carry? (short names)"
                name: carries
                widget: list
                field: { label: "Product short name", name: slug, widget: string }
