# Deploys the site to GitHub Pages via Actions — replaces the flaky legacy
# "pages build and deployment" pipeline. Static site, no build step.
name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch: {}   # manual "Run workflow" button in the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

# Queue deploys instead of colliding; never cancel one mid-flight
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
